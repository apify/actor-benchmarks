name: Run code checks

on:
  # Trigger code checks on opening a new pull request.
  pull_request:

  # Pushing to the master branch triggers code checks
  push:
    branches:
      - master
    tags-ignore:
      - "**" # Ignore all tags to prevent duplicate checks when tags are pushed.

  # It should also be possible to trigger checks manually
  workflow_dispatch:

jobs:
  lint_check:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: apify/actions/python-lint-check@v1.9.0
        with:
          python-version: "3.13"

  type_check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: apify/actions/python-type-check@v1.9.0
        with:
          python-version: "3.13"
